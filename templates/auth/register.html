{% extends "layout.html" %}

{% block title %}Criar Conta{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/Logopagmoto_preto.png') }}" alt="PagMoto" height="45" class="mb-2">
                    <p class="text-muted small mb-0">Comece agora com 15 dias grátis para organizar seus motoboys</p>
                </div>

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Seu Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: João Silva" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="nome_loja" class="form-label">Nome da Pizzaria / Lancheria</label>
                        <input type="text" class="form-control" id="nome_loja" name="nome_loja" placeholder="Ex: Pizzaria Sabor Real" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail de Acesso</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="contato@pizzaria.com" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label for="confirmation" class="form-label">Confirmar Senha</label>
                            <input type="password" class="form-control" id="confirmation" name="confirmation" placeholder="Repita a senha" minlength="6" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark fw-bold">
                            Criar Minha Loja
                        </button>
                    </div>
                </form>

                <hr class="my-4">

                <p class="text-center text-muted small mb-0">
                    Já possui cadastro? <a href="/login" class="text-decoration-none fw-semibold">Fazer login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
