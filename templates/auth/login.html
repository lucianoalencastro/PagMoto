{% extends "layout.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/Logopagmoto_preto.png') }}" alt="PagMoto" height="45" class="mb-2">
                    <p class="text-muted small mb-0">Acesse o fechamento de entregas da sua loja</p>
                </div>

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark fw-semibold">
                            Entrar
                        </button>
                    </div>
                </form>

                <hr class="my-4">

                <p class="text-center text-muted small mb-0">
                    Ainda não tem conta? <a href="/register" class="text-decoration-none fw-semibold">Cadastre sua loja</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
